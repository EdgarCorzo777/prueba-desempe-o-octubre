services:
  # ----------------------------------------------------------------------------
  # 0. Lakehouse Object Storage (Capa Bronze NoSQL): MinIO S3
  # ----------------------------------------------------------------------------
  minio:
    image: alpine/minio:latest-release
    container_name: sismowatch_minio
    restart: always
    # La imagen corre con usuario "minio" y no puede escribir en el volumen nombrado
    # recién creado (propietario root); se ejecuta como root para evitar el crashloop.
    user: root
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sismowatch_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sismowatch_minio_pass_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - sismowatch_net

  # ----------------------------------------------------------------------------
  # 1. Almacenamiento Medallion: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sismowatch_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sismowatch_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sismowatch_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch_db}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sismowatch_net

  # ----------------------------------------------------------------------------
  # 2. Orquestador: Apache Airflow 3.3.2 (Standalone Mode)
  # ----------------------------------------------------------------------------
  airflow:
    image: apache/airflow:3.3.2
    container_name: sismowatch_airflow
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-sismowatch_admin}:${POSTGRES_PASSWORD:-sismowatch_db_pass_2026}@postgres:5432/${POSTGRES_DB:-sismowatch_db}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZPo=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-sismowatch_airflow_secret_key_32bytes_min_len}
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD:-admin_sismowatch}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch_db}
      INGESTION_USER: ${INGESTION_USER:-ingest_user}
      INGESTION_PASSWORD: ${INGESTION_PASSWORD:-ingest_secret_2026}
      TRANSFORM_USER: ${TRANSFORM_USER:-transform_user}
      TRANSFORM_PASSWORD: ${TRANSFORM_PASSWORD:-transform_secret_2026}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sismowatch_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sismowatch_minio_pass_2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-sismowatch-bronze}
      PYTHONPATH: /opt/airflow:/opt/airflow/include
      # Paquetes extra instalados al arrancar el contenedor (cliente S3 para lago Bronze)
      _PIP_ADDITIONAL_REQUIREMENTS: minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/include:/opt/airflow/include
      - ./spark:/opt/airflow/spark
      - ./logs/airflow:/opt/airflow/logs
    ports:
      - "${AIRFLOW_PORT:-8088}:8080"
    command: standalone
    networks:
      - sismowatch_net

  # ----------------------------------------------------------------------------
  # 3. API Backend: FastAPI (Python 3.12, JWT, SSE, RBAC)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: sismowatch_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch_db}
      API_USER: ${API_USER:-api_user}
      API_PASSWORD: ${API_PASSWORD:-api_secret_2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sismowatch_jwt_secret_token_secure_key_hash_2026_xyz}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sismowatch.internal}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSecure2026!*}
      VIEWER_EMAIL: ${VIEWER_EMAIL:-viewer@sismowatch.internal}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-ViewerSecure2026!*}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # REST API de Airflow (estado real de los DAGs para /api/pipeline/status)
      AIRFLOW_API_BASE_URL: http://airflow:8080
      AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME:-admin}
      AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD:-admin_sismowatch}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sismowatch_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sismowatch_minio_pass_2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-sismowatch-bronze}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - sismowatch_net

  # ----------------------------------------------------------------------------
  # 4. Frontend Web: React + TypeScript + Vite + Tailwind CSS
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sismowatch_web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3001}:80"
    networks:
      - sismowatch_net

  # ----------------------------------------------------------------------------
  # 5. Catálogo de metadatos: OpenMetadata 2.0.7
  #    Arranca junto al stack con `docker compose up -d`.
  #    Stack dedicado (MySQL + Elasticsearch propios), aislado del Medallion.
  # ----------------------------------------------------------------------------
  openmetadata_mysql:
    container_name: sismowatch_openmetadata_mysql
    image: docker.getcollate.io/openmetadata/db:2.0.7
    command: "--sort_buffer_size=10M"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${OPENMETADATA_MYSQL_ROOT_PASSWORD:-password}
    expose:
      - 3306
    volumes:
      - openmetadata_db_data:/var/lib/mysql
    networks:
      sismowatch_net:
        aliases:
          - openmetadata-mysql
    healthcheck:
      test: mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --silent --execute "use openmetadata_db"
      interval: 15s
      timeout: 10s
      retries: 10

  openmetadata_elasticsearch:
    container_name: sismowatch_openmetadata_es
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - xpack.security.enabled=false
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - openmetadata_es_data:/usr/share/elasticsearch/data
    networks:
      sismowatch_net:
        aliases:
          - openmetadata-es

  openmetadata_migrate:
    container_name: sismowatch_openmetadata_migrate
    image: docker.getcollate.io/openmetadata/server:2.0.7
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-openmetadata}
      SERVER_PORT: 8585
      SERVER_ADMIN_PORT: 8586
      LOG_LEVEL: INFO
      MIGRATION_LIMIT_PARAM: 1200
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_RESPONSE_TYPE: id_token
      AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"
      AUTHENTICATION_AUTHORITY: https://accounts.google.com
      AUTHENTICATION_JWT_PRINCIPAL_CLAIMS: "[email,preferred_username,sub]"
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
      AUTHENTICATION_CLIENT_TYPE: public
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: "no-ssl"
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD:-openmetadata_password}
      DB_HOST: openmetadata-mysql
      DB_PORT: 3306
      OM_DATABASE: openmetadata_db
      ELASTICSEARCH_HOST: openmetadata-es
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_CONNECTION_TIMEOUT_SECS: 5
      ELASTICSEARCH_SOCKET_TIMEOUT_SECS: 60
      AIRFLOW_USERNAME: ${OPENMETADATA_INGESTION_AIRFLOW_USER:-admin}
      AIRFLOW_PASSWORD: ${OPENMETADATA_INGESTION_AIRFLOW_PASSWORD:-admin}
      FERNET_KEY: ${OPENMETADATA_FERNET_KEY:-jJ/9sz0g0OHxsfxOoSfdFdmk3ysNmPRnH3TUAbz3IHA=}
      EVENT_MONITOR: prometheus
      SECRET_MANAGER: db
      OM_EMAIL_ENTITY: "OpenMetadata"
      OPENMETADATA_HEAP_OPTS: -Xmx1G -Xms1G
    depends_on:
      openmetadata_elasticsearch:
        condition: service_healthy
      openmetadata_mysql:
        condition: service_healthy
    networks:
      - sismowatch_net

  openmetadata_server:
    container_name: sismowatch_openmetadata_server
    restart: always
    image: docker.getcollate.io/openmetadata/server:2.0.7
    environment:
      OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-openmetadata}
      SERVER_PORT: 8585
      SERVER_ADMIN_PORT: 8586
      LOG_LEVEL: INFO
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_RESPONSE_TYPE: id_token
      AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"
      AUTHENTICATION_AUTHORITY: https://accounts.google.com
      AUTHENTICATION_JWT_PRINCIPAL_CLAIMS: "[email,preferred_username,sub]"
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
      AUTHENTICATION_CLIENT_TYPE: public
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: "no-ssl"
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD:-openmetadata_password}
      DB_HOST: openmetadata-mysql
      DB_PORT: 3306
      OM_DATABASE: openmetadata_db
      ELASTICSEARCH_HOST: openmetadata-es
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_CONNECTION_TIMEOUT_SECS: 5
      ELASTICSEARCH_SOCKET_TIMEOUT_SECS: 60
      AIRFLOW_USERNAME: ${OPENMETADATA_INGESTION_AIRFLOW_USER:-admin}
      AIRFLOW_PASSWORD: ${OPENMETADATA_INGESTION_AIRFLOW_PASSWORD:-admin}
      FERNET_KEY: ${OPENMETADATA_FERNET_KEY:-jJ/9sz0g0OHxsfxOoSfdFdmk3ysNmPRnH3TUAbz3IHA=}
      EVENT_MONITOR: prometheus
      SECRET_MANAGER: db
      OM_EMAIL_ENTITY: "OpenMetadata"
      OPENMETADATA_HEAP_OPTS: -Xmx1G -Xms1G
    ports:
      - "${OPENMETADATA_PORT:-8585}:8585"

    depends_on:
      openmetadata_elasticsearch:
        condition: service_healthy
      openmetadata_mysql:
        condition: service_healthy
      openmetadata_migrate:
        condition: service_completed_successfully
    networks:
      sismowatch_net:
        aliases:
          - openmetadata-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]

  openmetadata_ingestion:
    container_name: sismowatch_openmetadata_ingestion
    image: docker.getcollate.io/openmetadata/ingestion:2.0.7
    depends_on:
      openmetadata_elasticsearch:
        condition: service_started
      openmetadata_mysql:
        condition: service_healthy
      openmetadata_server:
        condition: service_started
    environment:
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: "/opt/airflow/dag_generated_configs"
      DB_HOST: openmetadata-mysql
      DB_PORT: 3306
      AIRFLOW_DB: airflow_db
      DB_SCHEME: mysql+mysqldb
      DB_USER: airflow_user
      DB_PASSWORD: ${OPENMETADATA_AIRFLOW_DB_PASSWORD:-airflow_pass}
    entrypoint: /bin/bash
    command:
      - "/opt/airflow/ingestion_dependency.sh"
    expose:
      - 8080
    ports:
      - "${OPENMETADATA_INGESTION_PORT:-8085}:8080"
    networks:
      sismowatch_net:
        aliases:
          - openmetadata-ingestion
    volumes:
      - openmetadata_ingestion_dag_configs:/opt/airflow/dag_generated_configs
      - openmetadata_ingestion_dags:/opt/airflow/dags
      - openmetadata_ingestion_tmp:/tmp

  # ----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: sismowatch_postgres_data
  minio_data:
    name: sismowatch_minio_data
  openmetadata_db_data:
    name: sismowatch_openmetadata_db_data
  openmetadata_es_data:
    name: sismowatch_openmetadata_es_data
  openmetadata_ingestion_dag_configs:
    name: sismowatch_openmetadata_ingestion_dag_configs
  openmetadata_ingestion_dags:
    name: sismowatch_openmetadata_ingestion_dags
  openmetadata_ingestion_tmp:
    name: sismowatch_openmetadata_ingestion_tmp

networks:
  sismowatch_net:
    name: sismowatch_network
    driver: bridge
